{% extends "base.html" %}{% block content %}
<section class="block narrow"><h1 class="h1">{{ t.contact }}</h1>
{% with m = get_flashed_messages(with_categories=true) %}{% for c, x in m %}<p class="flash {{ c }}" role="alert">{{ x }}</p>{% endfor %}{% endwith %}
<form method="post" class="form"><input type="hidden" name="csrf" value="{{ csrf_token() }}">
<input class="hp" type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
<label>Nom<input name="name" required minlength="2" maxlength="100"></label>
<label>E-mail<input type="email" name="email" required maxlength="255"></label>
<label>Message<textarea name="message" rows="6" required minlength="10" maxlength="3000"></textarea></label>
<button class="btn" type="submit">Envoyer</button></form></section>{% endblock %}
