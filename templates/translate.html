{% extends "base.html" %}
{% block content %}
<section class="block" id="tr-page">
  <h1 class="h1">{{ t.translate }}</h1>
  <div class="langbar">
    <select id="tr-src" aria-label="{{ t.from }}"><option value="auto">{{ t.detect }}</option>{% for c, (n, _) in languages.items() %}<option value="{{ c }}">{{ n }}</option>{% endfor %}</select>
    <button class="icon-btn" id="tr-swap" type="button" aria-label="{{ t.swap }}">⇄</button>
    <select id="tr-dst" aria-label="{{ t.to }}">{% for c, (n, _) in languages.items() %}<option value="{{ c }}" {% if c == ('en' if lang == 'fr' else 'fr') %}selected{% endif %}>{{ n }}</option>{% endfor %}</select>
  </div>
  <div class="panes">
    <div><label class="sr" for="tr-in">{{ t.from }}</label><textarea id="tr-in" rows="6" maxlength="2000" placeholder="{{ t.type_here }}"></textarea>
      <div class="row"><button class="btn btn-ghost btn-small" id="tr-clear" type="button">{{ t.clear_text }}</button><span class="muted" id="tr-detected"></span></div></div>
    <div><p class="out" id="tr-out" aria-live="polite" dir="auto"></p>
      <div class="row"><button class="btn btn-ghost btn-small" id="tr-copy" type="button">{{ t.copy_text }}</button><button class="btn btn-ghost btn-small" id="tr-listen" type="button">{{ t.listen }}</button></div></div>
  </div>
  <h2 class="h">{{ t.history }}</h2><ul id="tr-history" class="history"></ul>
  <button class="btn btn-ghost btn-small" id="tr-clear-history" type="button">{{ t.clear_history }}</button>
</section>
{% endblock %}
{% block scripts %}<script src="/static/js/translate.js?v={{ v }}" defer></script>{% endblock %}
