{% extends "base.html" %}{% block content %}
<section class="block narrow"><h1 class="h1">Administration</h1>
{% if not configured %}<p class="flash err">Aucun mot de passe administrateur configuré (ADMIN_PASSWORD_HASH).</p>{% endif %}
{% with m = get_flashed_messages(with_categories=true) %}{% for c, x in m %}<p class="flash {{ c }}" role="alert">{{ x }}</p>{% endfor %}{% endwith %}
<form method="post" class="form"><input type="hidden" name="csrf" value="{{ csrf_token() }}">
<label>Identifiant<input name="user" autocomplete="username" required></label>
<label>Mot de passe<input type="password" name="password" autocomplete="current-password" required></label>
<button class="btn" type="submit">Connexion</button></form></section>{% endblock %}
